# Staging: a public preview of the full site, hidden from search engines.
# Deploy with: fly deploy -c fly.staging.toml

app = "picnicdev-staging"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[build.args]
  SITE_NOINDEX = "1"

[env]
  INTAKE_DATABASE_URL = "file:/data/intake.db"
  SITE_URL = "https://picnicdev-staging.fly.dev"

# Tickets live in SQLite on this volume, so they survive deploys and restarts.
[mounts]
  source = "intake_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # sleeps when nobody's looking, wakes on the next request
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
